name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel obsolete runs when a newer commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build backend package
        working-directory: backend
        run: python -m pip install .

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mock-auth:
    name: Mock Auth service build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mock-auth-service/requirements.txt

      - name: Install Mock Auth dependencies
        working-directory: mock-auth-service
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build Mock Auth package
        working-directory: mock-auth-service
        run: python -m pip install .

      - name: Run Mock Auth tests
        working-directory: mock-auth-service
        run: python -m pytest

  role-packs:
    name: "${{ matrix.service }} validation and tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - rasa-hr
          - rasa-admissions
          - rasa-it
    # Slice 17's IT role pack is not yet on main. Enable its matrix leg
    # automatically as soon as the service requirements file exists.
    if: ${{ matrix.service != 'rasa-it' || hashFiles('rasa-it/requirements.txt') != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install role-pack dependencies
        working-directory: ${{ matrix.service }}
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: ${{ matrix.service }}
        run: python -m compileall -q .

      - name: Run critical Python static checks
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 .

      - name: Run role-pack tests
        working-directory: ${{ matrix.service }}
        run: python -m pytest
