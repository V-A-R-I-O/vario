name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build backend package
        working-directory: backend
        run: python -m pip install .

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mock-auth:
    name: Mock Auth service build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mock-auth-service/requirements.txt

      - name: Install Mock Auth dependencies
        working-directory: mock-auth-service
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build Mock Auth package
        working-directory: mock-auth-service
        run: python -m pip install .

      - name: Run Mock Auth tests
        working-directory: mock-auth-service
        run: python -m pytest

  rasa-it:
    name: IT role-pack tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rasa-it/requirements.txt

      - name: Install IT role-pack dependencies
        working-directory: rasa-it
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Rasa YAML assets
        working-directory: rasa-it
        run: |
          python -c "import yaml; from pathlib import Path; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in [Path('config.yml'), Path('domain.yml'), Path('credentials.yml'), Path('endpoints.yml'), Path('data/nlu.yml'), Path('data/rules.yml'), Path('data/stories.yml')]]"

      - name: Run IT role-pack tests
        working-directory: rasa-it
        run: python -m pytest
