name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel obsolete runs when a newer commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build backend package
        working-directory: backend
        run: python -m pip install .

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -ra --strict-markers --junitxml=pytest-results.xml
          python -c 'import xml.etree.ElementTree as ET; root=ET.parse("pytest-results.xml"); skipped=sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite")); assert skipped == 0, f"{skipped} test(s) were skipped"'

      - name: Run Jira sync guardrail unit tests
        run: python -m unittest discover -s scripts/tests -v

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mock-auth:
    name: Mock Auth service build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mock-auth-service/requirements.txt

      - name: Install Mock Auth dependencies
        working-directory: mock-auth-service
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build Mock Auth package
        working-directory: mock-auth-service
        run: python -m pip install .

      - name: Run Mock Auth tests
        working-directory: mock-auth-service
        run: |
          python -m pytest -ra --strict-markers --junitxml=pytest-results.xml
          python -c 'import xml.etree.ElementTree as ET; root=ET.parse("pytest-results.xml"); skipped=sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite")); assert skipped == 0, f"{skipped} test(s) were skipped"'

  mock-services:
    name: "${{ matrix.service }} contract tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - mock-hrms-service
          - mock-itsm-service
          - mock-admissions-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install mock-service dependencies
        working-directory: ${{ matrix.service }}
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run mock-service contract tests
        working-directory: ${{ matrix.service }}
        run: |
          python -m pytest -ra --strict-markers --junitxml=pytest-results.xml
          python -c 'import xml.etree.ElementTree as ET; root=ET.parse("pytest-results.xml"); skipped=sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite")); assert skipped == 0, f"{skipped} test(s) were skipped"'

  role-packs:
    name: "${{ matrix.service }} validation and tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - rasa-hr
          - rasa-admissions
    # IT uses a separate Python 3.10 job because Rasa 3.6 is not supported on Python 3.11.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install role-pack dependencies
        working-directory: ${{ matrix.service }}
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      # HR's dialogue-router integration test imports backend services/models.
      - name: Install backend integration-test dependencies
        if: matrix.service == 'rasa-hr'
        run: python -m pip install -r backend/requirements.txt

      - name: Validate Python syntax
        working-directory: ${{ matrix.service }}
        run: python -m compileall -q .

      - name: Run critical Python static checks
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 .

      - name: Run role-pack tests
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" = "rasa-hr" ]; then
            python -m pytest -ra --strict-markers --junitxml=pytest-results.xml -k "not test_rasa_data_validate and not test_rasa_trained_nlu_model_metrics"
          else
            python -m pytest -ra --strict-markers --junitxml=pytest-results.xml
          fi
          python -c 'import xml.etree.ElementTree as ET; root=ET.parse("pytest-results.xml"); skipped=sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite")); assert skipped == 0, f"{skipped} test(s) were skipped"'

  rasa-it:
    name: IT Rasa role-pack validation and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: rasa-it/requirements.txt

      - name: Install IT role-pack dependencies
        working-directory: rasa-it
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Python syntax
        working-directory: rasa-it
        run: python -m compileall -q .

      - name: Run critical Python static checks
        working-directory: rasa-it
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 .

      - name: Run IT role-pack tests
        working-directory: rasa-it
        run: |
          python -m pytest -ra --strict-markers --junitxml=pytest-results.xml
          python -c 'import xml.etree.ElementTree as ET; root=ET.parse("pytest-results.xml"); skipped=sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite")); assert skipped == 0, f"{skipped} test(s) were skipped"'

  rasa-hr-real-integration:
    name: HR Rasa 3.6 integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Rasa integration test dependencies
        run: python -m pip install --upgrade pip && python -m pip install rasa==3.6.20 pytest==8.1.1 pytest-asyncio==0.23.6 PyYAML==6.0.1

      - name: Train HR NLU model
        working-directory: rasa-hr
        run: rasa train nlu --config config.yml --nlu data/nlu.yml --out models

      - name: Evaluate HR NLU model
        working-directory: rasa-hr
        run: rasa test nlu --config config.yml --domain domain.yml --nlu data/nlu.yml --out results

      - name: Run real Rasa HR integration tests without skips
        working-directory: rasa-hr
        run: |
          python -m pytest -ra --strict-markers --junitxml=pytest-results.xml tests/test_real_rasa_hr.py
          python -c 'import xml.etree.ElementTree as ET; root=ET.parse("pytest-results.xml"); skipped=sum(int(s.attrib.get("skipped", "0")) for s in root.iter("testsuite")); assert skipped == 0, f"{skipped} test(s) were skipped"'

  rasa-data-validation:
    name: "${{ matrix.pack }} Rasa data validation"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - rasa-hr
          - rasa-it
          - rasa-admissions

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Rasa validator
        run: python -m pip install --upgrade pip && python -m pip install rasa==3.6.20

      - name: Validate role-pack training data
        working-directory: ${{ matrix.pack }}
        run: rasa data validate

  compose-config:
    name: Docker Compose configuration validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate full local stack configuration
        run: |
          cp .env.example .env
          docker compose --profile full config --quiet
