version: "3.1"

rules:
  - rule: Check application status rule
    steps:
      - intent: check_application_status
      - action: action_check_application_status

  - rule: Get document checklist rule
    steps:
      - intent: get_document_checklist
      - action: action_get_document_checklist

  - rule: Ask fee deadline rule
    steps:
      - intent: ask_fee_deadline
      - action: action_ask_fee_deadline

  - rule: Say greet
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Handle low confidence fallback
    steps:
      - intent: nlu_fallback
      - action: utter_default_fallback
