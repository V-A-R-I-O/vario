version: "3.1"

# Lookups are driven by the form rules in rules.yml; stories here only cover
# multi-turn paths that cannot contradict them.

stories:
  - story: Greet then ask about fees
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_fee_deadline
      - action: action_ask_fee_deadline

  - story: Fee follow-up question
    steps:
      - intent: ask_fee_deadline
      - action: action_ask_fee_deadline
      - intent: ask_fee_deadline
      - action: action_ask_fee_deadline

  - story: Fees then goodbye
    steps:
      - intent: ask_fee_deadline
      - action: action_ask_fee_deadline
      - intent: goodbye
      - action: utter_goodbye
