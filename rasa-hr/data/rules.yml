version: "3.1"

rules:
  - rule: Check leave balance rule
    steps:
      - intent: check_leave_balance
      - action: action_check_leave_balance

  - rule: Check leave status rule
    steps:
      - intent: ask_leave_status
      - action: action_ask_leave_status

  - rule: Say greet
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Handle WFH policy
    steps:
      - intent: ask_wfh_policy
      - action: utter_ask_wfh_policy

  - rule: Handle policy FAQ
    steps:
      - intent: ask_policy_faq
      - action: utter_ask_policy_faq

  - rule: Handle low confidence fallback
    steps:
      - intent: nlu_fallback
      - action: utter_default_fallback

  - rule: Activate leave request form
    steps:
      - intent: submit_leave_request
      - action: leave_request_form
      - active_loop: leave_request_form

  - rule: Submit leave request form
    condition:
      - active_loop: leave_request_form
    steps:
      - action: leave_request_form
      - active_loop: null
      - slot_was_set:
          - requested_slot: null
      - action: action_submit_leave

  - rule: Cancel leave request form at any step
    condition:
      - active_loop: leave_request_form
    steps:
      - intent: cancel
      - action: action_cancel_leave_request
      - active_loop: null
