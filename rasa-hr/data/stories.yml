version: "3.1"

stories:
  - story: Direct leave balance inquiry
    steps:
      - intent: check_leave_balance
      - action: action_check_leave_balance

  - story: Greet then ask leave balance
    steps:
      - intent: greet
      - action: utter_greet
      - intent: check_leave_balance
      - action: action_check_leave_balance

  - story: Leave balance with specific leave type
    steps:
      - intent: check_leave_balance
        entities:
          - leave_type: "annual"
      - action: action_check_leave_balance

  - story: Goodbye flow
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - story: Submit leave request - casual leave
    steps:
      - intent: submit_leave_request
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - leave_type: "casual"
          - start_date: "2026-10-20"
          - end_date: "2026-10-22"
          - reason: "family function"
      - action: action_submit_leave_request
      - intent: affirm
      - action: action_submit_leave_request

  - story: Submit leave request - sick leave
    steps:
      - intent: submit_leave_request
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - leave_type: "sick"
          - start_date: "2026-10-25"
          - end_date: "2026-10-25"
          - reason: "medical appointment"
      - action: action_submit_leave_request
      - intent: affirm
      - action: action_submit_leave_request

  - story: Submit leave request - annual leave
    steps:
      - intent: submit_leave_request
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - leave_type: "annual"
          - start_date: "2026-11-10"
          - end_date: "2026-11-24"
          - reason: "vacation"
      - action: action_submit_leave_request
      - intent: affirm
      - action: action_submit_leave_request

  - story: Submit leave request - cancel workflow
    steps:
      - intent: submit_leave_request
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - leave_type: "casual"
          - start_date: "2026-10-20"
          - end_date: "2026-10-22"
          - reason: "family function"
      - action: action_submit_leave_request
      - intent: deny
      - action: action_submit_leave_request

  - story: Submit leave request - invalid date then correct
    steps:
      - intent: submit_leave_request
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - leave_type: "casual"
          - start_date: "2026-09-20"  # past date
          - end_date: "2026-10-22"
          - reason: "family function"
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - start_date: "2026-10-20"  # corrected date
      - action: action_submit_leave_request
      - intent: affirm
      - action: action_submit_leave_request

  - story: Submit leave request - end date before start date then correct
    steps:
      - intent: submit_leave_request
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - leave_type: "casual"
          - start_date: "2026-10-25"
          - end_date: "2026-10-20"  # end before start
          - reason: "family function"
      - action: action_submit_leave_request
      - intent: inform
        entities:
          - end_date: "2026-10-27"  # corrected end date
      - action: action_submit_leave_request
      - intent: affirm
      - action: action_submit_leave_request

  - story: Direct policy question
    steps:
      - intent: ask_policy_faq
      - action: utter_ask_policy_faq

  - story: Greet then ask policy
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_policy_faq
      - action: utter_ask_policy_faq

  - story: Policy question about maternity leave
    steps:
      - intent: ask_policy_faq
        entities:
          - policy_topic: "maternity"
      - action: utter_ask_policy_faq

  - story: Direct WFH policy question
    steps:
      - intent: ask_wfh_policy
      - action: utter_ask_wfh_policy

  - story: Greet then ask WFH policy
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_wfh_policy
      - action: utter_ask_wfh_policy
