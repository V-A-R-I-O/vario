version: "3.1"

stories:
  - story: Direct leave balance inquiry
    steps:
      - intent: check_leave_balance
      - action: action_check_leave_balance

  - story: Greet then ask leave balance
    steps:
      - intent: greet
      - action: utter_greet
      - intent: check_leave_balance
      - action: action_check_leave_balance

  - story: Goodbye flow
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - story: Direct WFH policy inquiry
    steps:
      - intent: ask_wfh_policy
      - action: utter_ask_wfh_policy

  - story: Direct policy FAQ inquiry
    steps:
      - intent: ask_policy_faq
      - action: utter_ask_policy_faq

  - story: Complete leave request flow
    steps:
      - intent: submit_leave_request
      - action: leave_request_form
      - active_loop: leave_request_form
      - slot_was_set:
          - requested_slot: leave_type
      - intent: inform
        entities:
          - leave_type: casual
      - slot_was_set:
          - leave_type: casual
          - requested_slot: start_date
      - intent: inform
        entities:
          - start_date: "2026-11-10"
      - slot_was_set:
          - start_date: "2026-11-10"
          - requested_slot: end_date
      - intent: inform
        entities:
          - end_date: "2026-11-12"
      - slot_was_set:
          - end_date: "2026-11-12"
          - requested_slot: reason
      - intent: inform
      - slot_was_set:
          - reason: "Family event"
          - requested_slot: leave_confirm
      - intent: affirm
      - slot_was_set:
          - leave_confirm: true
          - requested_slot: null
      - active_loop: null
      - action: action_submit_leave

  - story: Cancel leave request at confirmation
    steps:
      - intent: submit_leave_request
      - action: leave_request_form
      - active_loop: leave_request_form
      - slot_was_set:
          - requested_slot: leave_type
      - intent: inform
        entities:
          - leave_type: annual
      - slot_was_set:
          - leave_type: annual
          - requested_slot: start_date
      - intent: inform
        entities:
          - start_date: "2026-11-15"
      - slot_was_set:
          - start_date: "2026-11-15"
          - requested_slot: end_date
      - intent: inform
        entities:
          - end_date: "2026-11-20"
      - slot_was_set:
          - end_date: "2026-11-20"
          - requested_slot: reason
      - intent: inform
      - slot_was_set:
          - reason: "Vacation trip"
          - requested_slot: leave_confirm
      - intent: cancel
      - action: action_cancel_leave_request
      - active_loop: null

  - story: Cancel leave request mid-form
    steps:
      - intent: submit_leave_request
      - action: leave_request_form
      - active_loop: leave_request_form
      - slot_was_set:
          - requested_slot: leave_type
      - intent: cancel
      - action: action_cancel_leave_request
      - active_loop: null

  - story: Deny leave request at confirmation
    steps:
      - intent: submit_leave_request
      - action: leave_request_form
      - active_loop: leave_request_form
      - slot_was_set:
          - requested_slot: leave_type
      - intent: inform
        entities:
          - leave_type: casual
      - slot_was_set:
          - leave_type: casual
          - requested_slot: start_date
      - intent: inform
        entities:
          - start_date: "2026-11-10"
      - slot_was_set:
          - start_date: "2026-11-10"
          - requested_slot: end_date
      - intent: inform
        entities:
          - end_date: "2026-11-12"
      - slot_was_set:
          - end_date: "2026-11-12"
          - requested_slot: reason
      - intent: inform
      - slot_was_set:
          - reason: "Personal matters"
          - requested_slot: leave_confirm
      - intent: deny
      - action: action_cancel_leave_request
      - active_loop: null

  - story: Interrupted leave form with balance check
    steps:
      - intent: submit_leave_request
      - action: leave_request_form
      - active_loop: leave_request_form
      - intent: check_leave_balance
      - action: action_check_leave_balance
      - action: leave_request_form
      - active_loop: leave_request_form
