version: "3.1"

intents:
  - check_leave_balance:
      use_entities:
        - leave_type
  - ask_leave_status:
      use_entities:
        - reference_id
  - submit_leave_request:
      use_entities:
        - leave_type
        - start_date
        - end_date
  - ask_policy_faq:
      use_entities:
        - policy_topic
  - ask_wfh_policy
  - inform:
      use_entities:
        - leave_type
        - start_date
        - end_date
        - reason
  - affirm
  - deny
  - cancel
  - greet
  - goodbye
  - nlu_fallback

entities:
  - leave_type
  - start_date
  - end_date
  - reason
  - policy_topic
  - employee_id
  - reference_id

slots:
  reference_id:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: reference_id

  leave_type:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: leave_type
        intent: submit_leave_request
      - type: from_entity
        entity: leave_type
        conditions:
          - active_loop: leave_request_form
      - type: from_text
        conditions:
          - active_loop: leave_request_form
            requested_slot: leave_type

  start_date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: start_date
        conditions:
          - active_loop: leave_request_form
      - type: from_text
        conditions:
          - active_loop: leave_request_form
            requested_slot: start_date

  end_date:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: end_date
        conditions:
          - active_loop: leave_request_form
      - type: from_text
        conditions:
          - active_loop: leave_request_form
            requested_slot: end_date

  reason:
    type: text
    influence_conversation: true
    mappings:
      - type: from_text
        conditions:
          - active_loop: leave_request_form
            requested_slot: reason

  leave_confirm:
    type: bool
    influence_conversation: true
    mappings:
      - type: from_intent
        value: true
        intent: affirm
        conditions:
          - active_loop: leave_request_form
            requested_slot: leave_confirm
      - type: from_intent
        value: false
        intent: deny
        conditions:
          - active_loop: leave_request_form
            requested_slot: leave_confirm
      - type: from_intent
        value: false
        intent: cancel
        conditions:
          - active_loop: leave_request_form
            requested_slot: leave_confirm
      - type: from_text
        conditions:
          - active_loop: leave_request_form
            requested_slot: leave_confirm

forms:
  leave_request_form:
    required_slots:
      - leave_type
      - start_date
      - end_date
      - reason
      - leave_confirm

responses:
  utter_greet:
    - text: "Hello! I am your VARIO HR Assistant. You can ask me to check your leave balance, submit a leave request, or ask about HR and remote work policies."

  utter_goodbye:
    - text: "Thank you for contacting HR. Have a wonderful day!"

  utter_ask_leave_type:
    - text: "What type of leave would you like to request?"
      buttons:
        - title: "Casual"
          payload: "casual"
        - title: "Sick"
          payload: "sick"
        - title: "Earned"
          payload: "earned"
        - title: "Annual"
          payload: "annual"
      custom:
        vario:
          template_key: submit_leave_slot_prompt
          card:
            type: slot_prompt
            text: "What type of leave would you like to request?"
            options:
              - label: "Casual"
                value: "casual"
              - label: "Sick"
                value: "sick"
              - label: "Earned"
                value: "earned"
              - label: "Annual"
                value: "annual"

  utter_ask_start_date:
    - text: "What is the start date for your leave (YYYY-MM-DD or e.g. 'tomorrow')?"
      custom:
        vario:
          template_key: submit_leave_slot_prompt
          card:
            type: slot_prompt
            text: "What is the start date for your leave (YYYY-MM-DD or e.g. 'tomorrow')?"

  utter_ask_end_date:
    - text: "What is the end date for your leave (YYYY-MM-DD)?"
      custom:
        vario:
          template_key: submit_leave_slot_prompt
          card:
            type: slot_prompt
            text: "What is the end date for your leave (YYYY-MM-DD)?"

  utter_ask_reason:
    - text: "Please provide a reason for your leave request."
      custom:
        vario:
          template_key: submit_leave_slot_prompt
          card:
            type: slot_prompt
            text: "Please provide a reason for your leave request."

  utter_ask_leave_confirm:
    - text: "Please confirm your leave request: {leave_type} leave from {start_date} to {end_date}. Reason: {reason}."
      buttons:
        - title: "Confirm"
          payload: "confirm"
        - title: "Cancel"
          payload: "cancel"
      custom:
        vario:
          template_key: submit_leave_confirmation
          card:
            type: confirmation
            title: "Confirm leave request"
            text: "Please confirm your leave request."
            options:
              - label: "Confirm"
                value: "confirm"
              - label: "Cancel"
                value: "cancel"

  utter_ask_policy_faq:
    - text: "Employees are entitled to 8 casual days, 10 sick days, and 15 earned days annually. Unused earned leaves can be carried forward up to 5 days."
      custom:
        vario:
          template_key: ask_policy_faq_response
          card:
            type: faq_answer
            title: "Company Leave Policy"
            text: "Employees are entitled to 8 casual days, 10 sick days, and 15 earned days annually. Unused earned leaves can be carried forward up to 5 days."

  utter_ask_maternity_policy:
    - text: "Primary caregivers receive 26 weeks of paid maternity and adoption leave."
      custom:
        vario:
          template_key: ask_maternity_policy_response
          card:
            type: faq_answer
            title: "Maternity Leave Policy"
            text: "Primary caregivers receive 26 weeks of paid maternity and adoption leave."

  utter_ask_paternity_policy:
    - text: "Secondary caregivers receive 2 weeks of paid paternity leave within the child's first 6 months."
      custom:
        vario:
          template_key: ask_paternity_policy_response
          card:
            type: faq_answer
            title: "Paternity Leave Policy"
            text: "Secondary caregivers receive 2 weeks of paid paternity leave within the child's first 6 months."

  utter_ask_sick_policy:
    - text: "Employees are entitled to 10 paid sick days per year. Sick leave exceeding 3 consecutive days requires a medical certificate."
      custom:
        vario:
          template_key: ask_sick_policy_response
          card:
            type: faq_answer
            title: "Sick Leave Policy"
            text: "Employees are entitled to 10 paid sick days per year. Sick leave exceeding 3 consecutive days requires a medical certificate."

  utter_ask_bereavement_policy:
    - text: "Employees are entitled to 5 consecutive business days of paid compassionate leave upon the loss of an immediate family member."
      custom:
        vario:
          template_key: ask_bereavement_policy_response
          card:
            type: faq_answer
            title: "Bereavement Leave Policy"
            text: "Employees are entitled to 5 consecutive business days of paid compassionate leave upon the loss of an immediate family member."

  utter_ask_carry_forward_policy:
    - text: "Employees may carry forward up to 5 days of unused earned leave into the following calendar year."
      custom:
        vario:
          template_key: ask_carry_forward_policy_response
          card:
            type: faq_answer
            title: "Leave Carry-Forward Policy"
            text: "Employees may carry forward up to 5 days of unused earned leave into the following calendar year."

  utter_ask_wfh_policy:
    - text: "Employees may work remotely up to 2 days per week with line manager alignment. Core collaborative working hours are 10:00 AM to 4:00 PM."
      custom:
        vario:
          template_key: ask_wfh_policy_response
          card:
            type: faq_answer
            title: "Work From Home Policy"
            text: "Employees may work remotely up to 2 days per week with line manager alignment. Core collaborative working hours are 10:00 AM to 4:00 PM."

  utter_default_fallback:
    - text: "I can help with leave balances, leave requests, and leave or WFH policies. For travel or expense policies, please check the employee portal or contact HR."
      custom:
        vario:
          card:
            type: plain_text
            text: "I can help with leave balances, leave requests, and leave or WFH policies. For travel or expense policies, please check the employee portal or contact HR."

actions:
  - action_check_leave_balance
  - action_ask_leave_status
  - validate_leave_request_form
  - action_ask_leave_confirm
  - action_submit_leave
  - action_cancel_leave_request

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: false
