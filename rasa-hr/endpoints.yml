# Endpoints configuration for Rasa HR (ADR-006)
action_endpoint:
  url: ${RASA_ACTION_ENDPOINT_URL:-http://localhost:5055/webhook}

tracker_store:
  type: vario_rasa.tracker_store.RedactingSQLTrackerStore
  dialect: postgresql
  url: ${POSTGRES_HOST:-postgres}
  db: ${RASA_HR_DB:-rasa_hr}
  username: ${POSTGRES_USER:-postgres}
  password: ${POSTGRES_PASSWORD:-postgres}
