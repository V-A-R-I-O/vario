# Rasa only expands plain, unquoted ${VAR} references — a quoted value is sent literally.
action_endpoint:
  url: ${ACTION_ENDPOINT_URL}
tracker_store:
  type: vario_rasa.tracker_store.RedactingSQLTrackerStore
  dialect: postgresql
  url: ${POSTGRES_HOST}
  db: ${POSTGRES_DB}
  username: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
